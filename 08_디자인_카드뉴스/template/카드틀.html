<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 카드뉴스 틀 (1080x1080). {{제목}} {{본문}} {{번호}} 자리를 스크립트가 채워요. -->
<style>
  body { margin: 0; }
  .card { width: 1080px; height: 1080px; box-sizing: border-box; padding: 110px 100px;
          background: #fffaf0; font-family: "Apple SD Gothic Neo", sans-serif; position: relative; }
  .no { font-size: 36px; color: #e8590c; font-weight: 800; }
  h2 { font-size: 76px; line-height: 1.2; margin: 30px 0 50px; color: #212529; }
  p { font-size: 46px; line-height: 1.6; color: #495057; }
  .foot { position: absolute; bottom: 60px; right: 80px; font-size: 30px; color: #adb5bd; }
</style></head><body>
<div class="card"><div class="no">{{번호}}</div><h2>{{제목}}</h2><p>{{본문}}</p><div class="foot">@my_channel</div></div>
</body></html>
