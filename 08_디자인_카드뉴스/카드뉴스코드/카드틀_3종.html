<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 카드뉴스 틀 3종 (1080x1080): 표지 / 본문 / 마지막
     스크립트가 {{종류}} {{번호}} {{큰숫자}} {{제목}} {{본문}} 자리를 채워요.
     원본 template/카드틀.html 을 바탕으로 만든 사본이에요. -->
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  .card { width: 1080px; height: 1080px; box-sizing: border-box; padding: 100px;
          font-family: "Apple SD Gothic Neo", sans-serif; position: relative;
          display: flex; flex-direction: column; justify-content: center;
          word-break: keep-all; }                     /* 단어 중간에서 줄 안 바꾸기 */
  .no   { position: absolute; top: 70px; left: 100px; font-size: 34px; font-weight: 800; }
  .foot { position: absolute; bottom: 60px; right: 80px; font-size: 30px; }
  h2 { margin: 0; font-weight: 900; }
  p  { margin: 0; }

  /* ── 표지: 진한 남색 + 아주 큰 제목 ── */
  .표지 { background: #1f2a44; color: #fff; }
  .표지 .no { color: #ffa94d; }
  .표지 .bar { width: 140px; height: 14px; background: #ff922b; margin-bottom: 50px; }
  .표지 h2 { font-size: 112px; line-height: 1.2; letter-spacing: -3px; }
  .표지 p  { font-size: 48px; line-height: 1.5; margin-top: 60px; color: #ced4da; }
  .표지 .foot { color: #868e96; }
  /* 표지 그림이 있을 때: 그림은 오른쪽 아래에 있으니 글은 위로 올리고 폭을 줄임 */
  .표지.그림 { background: #060c2a url("../표지배경.png") center/cover no-repeat;
              justify-content: flex-start; padding-top: 170px; }
  .표지.그림 p { max-width: 560px; margin-top: 50px; }
  .표지.그림 .foot { top: 70px; bottom: auto; }
  .표지 .swipe { position: absolute; bottom: 60px; left: 100px; font-size: 34px; color: #ffa94d; font-weight: 700; }

  /* ── 본문: 밝은 배경 + 큰 숫자 ── */
  .본문 { background: #fffaf0; color: #212529; }
  .본문 .no { color: #e8590c; }
  .본문 .big { font-size: 220px; font-weight: 900; color: #ff922b; line-height: 1; margin-bottom: 30px; }
  .본문 h2 { font-size: 84px; line-height: 1.25; letter-spacing: -2px; }
  .본문 .line { width: 100px; height: 10px; background: #212529; margin: 50px 0; }
  .본문 p  { font-size: 52px; line-height: 1.6; color: #495057; }
  .본문 .foot { color: #adb5bd; }
  .본문 .step { display: block; font-size: 64px; font-weight: 800; line-height: 1.45; color: #212529; }
  .본문 .step b { color: #ff922b; margin-right: 24px; }

  /* ── 마지막: 주황 배경 + 저장 아이콘 ── */
  .마지막 { background: #e8590c; color: #fff; }
  .마지막 .no { color: #ffe8cc; }
  .마지막 h2 { font-size: 100px; line-height: 1.25; letter-spacing: -3px; }
  .마지막 p  { font-size: 52px; line-height: 1.5; margin-top: 50px; color: #fff4e6; }
  .마지막 .foot { color: #ffd8a8; }
  .마지막 .save { position: absolute; right: 100px; bottom: 140px; width: 150px; }
</style></head><body>
<div class="card {{종류}}">
  <div class="no">{{번호}}</div>
  {{큰숫자}}
  <h2>{{제목}}</h2>
  {{본문}}
  <div class="foot">@my_channel</div>
</div>
</body></html>
