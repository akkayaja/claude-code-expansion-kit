<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: "Apple SD Gothic Neo", sans-serif; width: 240px; margin: 0; padding: 14px 16px; }
    #msg { font-size: 15px; font-weight: 700; }
    #sub { font-size: 12px; color: #666; margin-top: 6px; line-height: 1.5; }
    #focus { display: none; width: 100%; margin-top: 12px; padding: 8px 0; border: 0; border-radius: 8px;
             font: 700 14px "Apple SD Gothic Neo", sans-serif; cursor: pointer; background: #1e2a3a; color: #fff; }
    #focus.on { background: #ffd43b; color: #111; }
  </style>
</head>
<body>
  <div id="msg">복사하는 중…</div>
  <div id="sub"></div>
  <button id="focus">🎯 집중 모드 켜기</button>
  <script src="popup.js"></script>
</body>
</html>
