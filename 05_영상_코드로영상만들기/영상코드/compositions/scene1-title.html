<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="../data.js"></script>
    <style>
      #scene1 {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: flex-start; justify-content: flex-start;
        gap: 48px; padding: 480px 140px 0; text-align: left;
        font-family: "Noto Sans KR", sans-serif;
        color: #fdf6e3;
      }
      #title-tag { font-size: 56px; font-weight: 700; color: #f4a261; letter-spacing: 0.05em; }
      #title { font-size: 100px; font-weight: 900; line-height: 1.3; letter-spacing: -0.02em; }
      #title .hl { color: #f4a261; }
    </style>
  </head>
  <body>
    <!-- 장면 1 (4초): 큰 제목이 아래에서 올라옴 -->
    <div id="scene1" data-composition-id="scene1" data-width="1080" data-height="1920" data-duration="4">
      <div id="title-tag"></div>
      <h1 id="title"></h1>
    </div>
    <script>
      // 글자는 data.js(영상설정)에서 가져와 채운다
      const 설정 = window.영상설정;
      const 연도 = 설정.연도;
      document.getElementById("title-tag").textContent = `${설정.아이콘} ${연도[0]} → ${연도[연도.length - 1]}`;
      document.getElementById("title").innerHTML =
        `${설정.기간}년 동안<br>${설정.주제}${설정.조사} <span class="hl">가장 많이</span><br>늘어난 도시는?`;

      const tl = gsap.timeline({ paused: true });
      // 0초: 제목이 아래(+300px)에서 출발해 1초 동안 제자리로 올라옴
      tl.fromTo("#title", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power3.out" }, 0);
      // 3.5초: 다음 장면을 위해 서서히 사라짐
      tl.to("#scene1", { opacity: 0, duration: 0.5 }, 3.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["scene1"] = tl;
    </script>
  </body>
</html>
