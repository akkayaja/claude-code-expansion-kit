<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14213d; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30"
         data-width="1080" data-height="1920">
      <!-- 장면 1: 제목 (0~4초) -->
      <div id="s1" class="clip" data-composition-id="scene1" data-composition-src="compositions/scene1-title.html"
           data-start="0" data-duration="4" data-track-index="0"></div>
      <!-- 장면 2: 막대 경주 (4~20초) -->
      <div id="s2" class="clip" data-composition-id="scene2" data-composition-src="compositions/scene2-race.html"
           data-start="4" data-duration="16" data-track-index="0"></div>
      <!-- 장면 3: 1위 강조 (20~26초) -->
      <div id="s3" class="clip" data-composition-id="scene3" data-composition-src="compositions/scene3-winner.html"
           data-start="20" data-duration="6" data-track-index="0"></div>
      <!-- 장면 4: 마무리 (26~30초) -->
      <div id="s4" class="clip" data-composition-id="scene4" data-composition-src="compositions/scene4-outro.html"
           data-start="26" data-duration="4" data-track-index="0"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
