<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 물</title>
<!-- PWA: 앱 정보 파일과 아이콘 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c6dd0">
<link rel="icon" href="icons/icon-192.png">
<!-- 아이폰용: 홈 화면 아이콘, 주소창 없이 열기, 홈 화면 이름 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘의 물">
<style>
  :root {
    --bg: #f2f7fd; --card: #ffffff; --text: #16324f; --sub: #5b7590;
    --main: #1c6dd0; --main-dark: #1559ab; --light: #d6e7fb; --ok: #1f9d6b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1a27; --card: #172636; --text: #e6f0fb; --sub: #93abc4;
            --main: #3d8bf0; --main-dark: #2f74cf; --light: #23384f; --ok: #3cc48d; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    user-select: none; -webkit-user-select: none;
  }
  main { flex: 1; overflow-y: auto; padding: 20px 20px 12px; max-width: 480px; width: 100%; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 18px; }
  .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .screen { display: none; }
  .screen.on { display: block; }

  /* 기록 화면 */
  .amount { text-align: center; font-size: 40px; font-weight: 800; margin: 6px 0 2px; }
  .amount small { font-size: 18px; color: var(--sub); font-weight: 600; }
  .bar { height: 22px; background: var(--light); border-radius: 11px; overflow: hidden; margin: 14px 0 8px; }
  .bar > div { height: 100%; width: 0; background: var(--main); border-radius: 11px; transition: width .35s; }
  .bar.done > div { background: var(--ok); }
  .percent { text-align: center; color: var(--sub); font-size: 16px; }
  .drink {
    display: block; width: 100%; margin: 26px 0 14px; padding: 26px 10px;
    font-size: 24px; font-weight: 800; color: #fff; background: var(--main);
    border: 0; border-radius: 24px; box-shadow: 0 6px 0 var(--main-dark); cursor: pointer;
  }
  .drink small { display: block; font-size: 15px; font-weight: 600; opacity: .85; margin-top: 4px; }
  .drink:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--main-dark); }
  .undo {
    display: block; margin: 0 auto; padding: 12px 22px; font-size: 16px;
    background: transparent; color: var(--sub); border: 2px solid var(--light); border-radius: 14px; cursor: pointer;
  }
  .undo:disabled { opacity: .4; }
  .msg { text-align: center; min-height: 24px; margin-top: 14px; color: var(--ok); font-weight: 700; }
  /* 리마인더 카드 */
  .remind {
    display: none; margin: 0 0 14px; padding: 14px 16px; border-radius: 16px;
    background: #fff4d6; color: #6b4b00; font-size: 16px; font-weight: 700; line-height: 1.4;
  }
  .remind.on { display: block; }
  .remind small { display: block; font-weight: 500; font-size: 13px; margin-top: 2px; opacity: .85; }
  @media (prefers-color-scheme: dark) { .remind { background: #3d3214; color: #ffe08a; } }
  .badge-btn {
    display: block; margin: 18px auto 0; padding: 8px 14px; font-size: 13px;
    background: none; border: 0; color: var(--sub); text-decoration: underline; cursor: pointer;
  }

  /* 통계 화면 */
  .chart { position: relative; display: flex; align-items: flex-end; gap: 8px; height: 200px; margin: 30px 0 8px; }
  .goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ok); }
  .goal-line span { position: absolute; right: 0; top: -20px; font-size: 12px; color: var(--ok); }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .col .v { font-size: 11px; color: var(--sub); margin-bottom: 3px; }
  .col .b { width: 100%; background: var(--main); border-radius: 8px 8px 0 0; min-height: 3px; }
  .col.met .b { background: var(--ok); }
  .col.today .b { outline: 3px solid var(--text); outline-offset: 2px; }
  .days { display: flex; gap: 8px; }
  .days div { flex: 1; text-align: center; font-size: 13px; color: var(--sub); }
  .days div.today { color: var(--main); font-weight: 800; }
  .summary { margin-top: 20px; font-size: 20px; font-weight: 800; text-align: center; }
  .summary small { display: block; font-size: 14px; color: var(--sub); font-weight: 500; margin-top: 6px; }

  /* 아래 탭 */
  nav {
    display: flex; background: var(--card); border-top: 1px solid var(--light);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; padding: 14px 0 12px; font-size: 15px; font-weight: 700; background: none; border: 0;
    color: var(--sub); cursor: pointer;
  }
  nav button .i { display: block; font-size: 22px; margin-bottom: 2px; }
  nav button.on { color: var(--main); }
</style>
</head>
<body>
<main>
  <!-- 화면 1: 기록 -->
  <section id="s-log" class="screen on">
    <h1>💧 오늘의 물</h1>
    <div class="remind" id="remind"></div>
    <div class="card">
      <div class="amount"><span id="today-ml">0</span><small> / 2,000ml</small></div>
      <div class="bar" id="bar"><div id="bar-fill"></div></div>
      <div class="percent" id="percent">0%</div>
    </div>
    <button class="drink" id="drink">🥤 한 잔 마셨어요<small>+250ml</small></button>
    <button class="undo" id="undo">↩ 되돌리기</button>
    <div class="msg" id="msg"></div>
    <button class="badge-btn" id="badge-btn" hidden>🔴 홈 화면 아이콘에 남은 잔 수 표시하기</button>
  </section>

  <!-- 화면 2: 통계 -->
  <section id="s-stats" class="screen">
    <h1>📊 최근 7일</h1>
    <div class="card">
      <div class="chart" id="chart"></div>
      <div class="days" id="days"></div>
      <div class="summary" id="summary"></div>
    </div>
  </section>
</main>

<nav>
  <button id="t-log" class="on"><span class="i">💧</span>기록</button>
  <button id="t-stats"><span class="i">📊</span>통계</button>
</nav>

<script>
  const GOAL = 2000;          // 하루 목표 (ml)
  const CUP = 250;            // 한 잔 (ml)
  const KEY = 'water-log';    // 휴대폰 안 저장소(localStorage) 이름
  const LAST = 'water-last';  // 마지막으로 '한 잔'을 누른 시각
  const REMIND_MIN = 120;     // 이 시간(분)이 지나면 리마인더 카드를 보여 줌

  // 저장된 기록 읽기: { "2026-11-24": 1250, ... } 날짜별로 마신 양
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  // 휴대폰 시간 기준 날짜 글자 (예: 2026-11-24)
  function dayKey(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  const won = n => n.toLocaleString('ko-KR');

  let data = load();

  function drawLog() {
    const ml = data[dayKey(new Date())] || 0;
    const pct = Math.round(ml / GOAL * 100);
    document.getElementById('today-ml').textContent = won(ml);
    document.getElementById('bar-fill').style.width = Math.min(pct, 100) + '%';
    document.getElementById('bar').classList.toggle('done', ml >= GOAL);
    document.getElementById('percent').textContent = pct + '%';
    document.getElementById('undo').disabled = ml === 0;
    drawRemind(ml);
    updateBadge(ml);
  }

  // 리마인더 카드: 목표 전인데 마지막 한 잔에서 2시간 넘게 지났으면 보여 줌
  function drawRemind(ml) {
    const box = document.getElementById('remind');
    let text = '';
    if (ml < GOAL) {
      const left = Math.ceil((GOAL - ml) / CUP);
      let last = 0;
      try { last = Number(localStorage.getItem(LAST)) || 0; } catch (e) {}
      const isToday = last && dayKey(new Date(last)) === dayKey(new Date());
      if (ml === 0 && new Date().getHours() >= 9) {
        text = '☀️ 오늘 아직 한 잔도 안 마셨어요<small>지금 한 잔으로 시작해요 · 남은 잔 ' + left + '잔</small>';
      } else if (isToday) {
        const min = Math.floor((Date.now() - last) / 60000);
        if (min >= REMIND_MIN) {
          const h = Math.floor(min / 60), m = min % 60;
          text = '⏰ 마지막 한 잔에서 ' + h + '시간' + (m ? ' ' + m + '분' : '') + ' 지났어요<small>한 잔 어때요? · 남은 잔 ' + left + '잔</small>';
        }
      }
    }
    box.innerHTML = text;
    box.classList.toggle('on', !!text);
  }

  // 홈 화면 아이콘의 빨간 숫자 = 오늘 남은 잔 수 (목표 채우면 지움)
  function updateBadge(ml) {
    if (!('setAppBadge' in navigator)) return;
    const left = Math.max(0, Math.ceil((GOAL - ml) / CUP));
    const p = left ? navigator.setAppBadge(left) : navigator.clearAppBadge();
    if (p && p.catch) p.catch(() => {});
  }

  // 아이폰은 아이콘 숫자에도 '알림 허용'이 필요해서, 허용 전이면 버튼을 보여 줌
  const badgeBtn = document.getElementById('badge-btn');
  function drawBadgeBtn() {
    badgeBtn.hidden = !('setAppBadge' in navigator && 'Notification' in window && Notification.permission === 'default');
  }
  badgeBtn.addEventListener('click', () => {
    Notification.requestPermission().then(() => { drawBadgeBtn(); drawLog(); });
  });
  drawBadgeBtn();
  setInterval(() => { if (!document.hidden && document.getElementById('s-log').classList.contains('on')) drawLog(); }, 60000);

  function drawStats() {
    const names = ['일', '월', '화', '수', '목', '금', '토'];
    const list = [];
    for (let i = 6; i >= 0; i--) {             // 6일 전 ~ 오늘
      const d = new Date(); d.setDate(d.getDate() - i);
      list.push({ name: i === 0 ? '오늘' : names[d.getDay()], ml: data[dayKey(d)] || 0, today: i === 0 });
    }
    const top = Math.max(GOAL * 1.25, ...list.map(x => x.ml));   // 그래프 맨 위 값
    const chart = document.getElementById('chart');
    chart.innerHTML = '<div class="goal-line" style="bottom:' + (GOAL / top * 100) + '%"><span>목표 2,000ml</span></div>';
    list.forEach(x => {
      chart.insertAdjacentHTML('beforeend',
        '<div class="col' + (x.ml >= GOAL ? ' met' : '') + (x.today ? ' today' : '') + '">' +
        '<div class="v">' + (x.ml ? won(x.ml) : '') + '</div>' +
        '<div class="b" style="height:' + (x.ml / top * 100) + '%"></div></div>');
    });
    document.getElementById('days').innerHTML =
      list.map(x => '<div' + (x.today ? ' class="today"' : '') + '>' + x.name + '</div>').join('');
    const met = list.filter(x => x.ml >= GOAL).length;
    const total = list.reduce((s, x) => s + x.ml, 0);
    document.getElementById('summary').innerHTML =
      '목표 채운 날: ' + met + '일 / 7일' +
      '<small>7일 동안 모두 ' + won(total) + 'ml · 하루 평균 ' + won(Math.round(total / 7)) + 'ml</small>';
  }

  let msgTimer;
  function say(text) {
    const m = document.getElementById('msg');
    m.textContent = text;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => m.textContent = '', 2000);
  }

  document.getElementById('drink').addEventListener('click', () => {
    data = load();
    const k = dayKey(new Date());
    const before = data[k] || 0;
    data[k] = before + CUP;
    save(data);
    try { localStorage.setItem(LAST, String(Date.now())); } catch (e) {}
    drawLog();
    if (before < GOAL && data[k] >= GOAL) say('🎉 오늘 목표 달성!');
    else say('좋아요! +250ml');
    if (navigator.vibrate) navigator.vibrate(30);
  });

  document.getElementById('undo').addEventListener('click', () => {
    data = load();
    const k = dayKey(new Date());
    if (!data[k]) return;
    data[k] = Math.max(0, data[k] - CUP);
    if (data[k] === 0) delete data[k];
    save(data);
    drawLog();
    say('한 잔 되돌렸어요');
  });

  function show(which) {
    document.getElementById('s-log').classList.toggle('on', which === 'log');
    document.getElementById('s-stats').classList.toggle('on', which === 'stats');
    document.getElementById('t-log').classList.toggle('on', which === 'log');
    document.getElementById('t-stats').classList.toggle('on', which === 'stats');
    data = load();
    which === 'log' ? drawLog() : drawStats();
  }
  document.getElementById('t-log').addEventListener('click', () => show('log'));
  document.getElementById('t-stats').addEventListener('click', () => show('stats'));

  // 앱을 다시 열었을 때(자정이 지났을 수도 있음) 화면 새로 그리기
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) show(document.getElementById('s-log').classList.contains('on') ? 'log' : 'stats');
  });

  drawLog();

  // PWA: 서비스 워커 등록 (인터넷이 없어도 열리게 해 주는 '보관 담당')
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
